# GitHub Actions workflow for database provisioning.
#
# Required secret (Settings → Secrets and variables → Actions):
#   RAILWAY_TOKEN — Railway API token (https://railway.com/account/tokens)

name: Provision Databases

on:
  push:
    branches: [main]
    paths:
      - "services.txt"
      - ".github/workflows/provision-databases.yml"
  workflow_dispatch:

jobs:
  provision:
    name: Provision Databases
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_NAME: DB-Provisioner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure DB variables and deploy
        run: |
          docker run --rm \
            -e RAILWAY_TOKEN \
            -e RAILWAY_SERVICE_NAME \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/pecatatoshev/railway-db-provisioner-ci:latest
